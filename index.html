<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Archive</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10131b;color:#eef2ff;font:16px/1.5 system-ui,"Noto Sans KR",sans-serif}
main{max-width:920px;margin:auto;padding:22px 16px 50px}header{padding:12px 0 20px}h1{font-size:clamp(28px,5vw,40px);margin:0}h2{font-size:19px;margin:0 0 12px}
.panel{background:#1a2030;border:1px solid #303b50;border-radius:15px;padding:16px;margin:14px 0}
input,textarea,button{width:100%;font:inherit;padding:10px;border-radius:9px;border:1px solid #35415a;background:#111725;color:#eef2ff;margin:6px 0}
textarea{min-height:80px;resize:vertical}button{background:#293653;cursor:pointer;font-weight:600}button:hover{background:#35466a}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.status,small{color:#a8b2c7;font-size:13px}.entry{border-top:1px solid #303b50;padding:12px 0}.entry:first-child{border-top:0}.entry small{display:block}.entry button{width:auto;padding:5px 9px;font-size:12px;background:#472b35}.entry button.edit{background:#293653;margin-right:6px}.muted{color:#a8b2c7}
</style></head><body><main>
<header><h1>Study Archive</h1><p class="muted">공유 일정 · 공지사항 · 공부 기록</p><div id="status" class="status">Supabase 연결 중…</div></header>
<section class="panel"><h2>닉네임</h2><div class="row"><input id="nickname" maxlength="24" placeholder="닉네임 입력"><button id="saveNick" style="max-width:130px">저장</button></div><small>닉네임은 표시용입니다. 익명 세션은 이 브라우저에 저장됩니다.</small></section>
<section class="panel"><h2>공유 일정</h2><input id="eventTitle" maxlength="120" placeholder="일정 제목"><div class="row"><input id="eventDate" type="date"><input id="eventTime" type="time"></div><textarea id="eventDetails" maxlength="1000" placeholder="내용, 장소, 준비물 등"></textarea><button id="addEvent">일정 추가</button><div id="events" class="status">불러오는 중…</div></section>
<section class="panel"><h2>공지사항</h2><input id="noticeTitle" maxlength="120" placeholder="공지 제목"><textarea id="noticeBody" maxlength="3000" placeholder="공지 내용"></textarea><button id="addNotice">공지 등록</button><div id="notices" class="status">불러오는 중…</div></section>
<section class="panel"><h2>공부 목표 & 통계</h2>
<label for="dailyGoal" class="muted">하루 목표 (분)</label><input id="dailyGoal" type="number" min="1" max="1440" value="60">
<button id="saveGoal">목표 저장</button><div id="goalStats" class="status">목표 통계 불러오는 중…</div>
<h2 style="margin-top:22px">퀘스트 & 업적</h2><div id="questBoard" class="status">업적 불러오는 중…</div>
<h2 style="margin-top:22px">공부 타이머</h2>
<label for="studySubject" class="muted">과목 / 공부 내용</label><input id="studySubject" maxlength="100" placeholder="예: 수학 미적분">
<div id="timerDisplay" style="font-size:clamp(32px,8vw,52px);font-weight:700;text-align:center;padding:12px 0;font-variant-numeric:tabular-nums">00:00:00</div>
<div class="row"><button id="timerStart">시작</button><button id="timerPause">일시정지</button><button id="timerReset">초기화</button></div>
<button id="timerSave">공부 기록 저장</button><p id="timerStatus" class="status">타이머를 시작해 공부 시간을 기록하세요.</p>
<h2 style="margin-top:22px">내 공부 기록</h2><div id="studyStats" class="status">기록 불러오는 중…</div><div id="studySessions"></div></section>
</main>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://ohnukfxqjkeihxwzopil.supabase.co","sb_publishable_rG1j0nKNE6SwDo3DbKBprw_XNBKuaAC");
const $=id=>document.getElementById(id);let user=null;let nickname=localStorage.getItem("study_nickname")||"";$("nickname").value=nickname;
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const author=()=>nickname.trim()||"익명";
$("saveNick").onclick=()=>{nickname=$("nickname").value.trim().slice(0,24);if(!nickname)return alert("닉네임을 입력해 주세요.");localStorage.setItem("study_nickname",nickname);$("status").textContent="연결됨 · 닉네임: "+nickname;};
async function init(){try{const s=await supabase.auth.getSession();user=s.data.session?.user||null;if(!user){const a=await supabase.auth.signInAnonymously();if(a.error)throw a.error;user=a.data.user;} $("status").textContent="Supabase 연결됨";await loadEvents();await loadNotices();await loadStudySessions();}catch(e){console.error(e);$("status").textContent="연결 실패: "+e.message;$("events").textContent="일정 불러오기 실패";$("notices").textContent="공지 불러오기 실패";}}
async function loadEvents(){const{data,error}=await supabase.from("shared_events").select("id,title,event_date,event_time,details,author_name").order("event_date",{ascending:true}).limit(100);if(error){$("events").textContent="일정 오류: "+error.message;return;}if(!data.length){$("events").innerHTML='<p class="muted">등록된 일정이 없습니다.</p>';return;}$("events").innerHTML=data.map(e=>`<div class="entry"><b>${escapeHTML(e.title)}</b><small>${escapeHTML(e.event_date)} ${escapeHTML(e.event_time||"")} · ${escapeHTML(e.author_name||"익명")}</small>${e.details?`<p>${escapeHTML(e.details)}</p>`:""}<button class="edit" data-event-edit="${e.id}">수정</button><button data-event-delete="${e.id}">삭제</button></div>`).join("");document.querySelectorAll("[data-event-edit]").forEach(b=>b.onclick=async()=>{const id=b.dataset.eventEdit;const {data,error}=await supabase.from("shared_events").select("title,event_date,event_time,details").eq("id",id).single();if(error)return alert("일정 불러오기 실패: "+error.message);const title=prompt("일정 제목",data.title);if(title===null)return;const date=prompt("날짜 (YYYY-MM-DD)",data.event_date);if(date===null)return;const time=prompt("시간 (HH:MM, 없으면 비워두기)",data.event_time||"");if(time===null)return;const details=prompt("내용",data.details||"");if(details===null)return;if(!title.trim()||!date.trim())return alert("제목과 날짜는 필수입니다.");const{error:saveError}=await supabase.from("shared_events").update({title:title.trim(),event_date:date.trim(),event_time:time.trim()||null,details:details.trim()||null}).eq("id",id);if(saveError)alert("수정 실패: "+saveError.message);else await loadEvents();});document.querySelectorAll("[data-event-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("이 일정을 삭제할까요?"))return;const{error}=await supabase.from("shared_events").delete().eq("id",b.dataset.eventDelete);if(error)alert("삭제 실패: "+error.message);else await loadEvents();});}
$("addEvent").onclick=async()=>{const title=$("eventTitle").value.trim(),date=$("eventDate").value;if(!title||!date)return alert("제목과 날짜를 입력해 주세요.");const{error}=await supabase.from("shared_events").insert({title,event_date:date,event_time:$("eventTime").value||null,details:$("eventDetails").value.trim()||null,author_name:author(),created_by:user?.id});if(error){alert("저장 실패: "+error.message);return;}$("eventTitle").value="";$("eventTime").value="";$("eventDetails").value="";await loadEvents();};
async function loadNotices(){const{data,error}=await supabase.from("notice_posts").select("id,title,body,author_name,created_at").order("created_at",{ascending:false}).limit(50);if(error){$("notices").textContent="공지 오류: "+error.message;return;}if(!data.length){$("notices").innerHTML='<p class="muted">등록된 공지가 없습니다.</p>';return;}$("notices").innerHTML=data.map(n=>`<div class="entry"><b>${escapeHTML(n.title)}</b><small>${escapeHTML(n.author_name||"익명")} · ${new Date(n.created_at).toLocaleString("ko-KR")}</small><p>${escapeHTML(n.body).replace(/\n/g,"<br>")}</p><button class="edit" data-notice-edit="${n.id}">수정</button><button data-notice-delete="${n.id}">삭제</button></div>`).join("");document.querySelectorAll("[data-notice-edit]").forEach(b=>b.onclick=async()=>{const id=b.dataset.noticeEdit;const{data,error}=await supabase.from("notice_posts").select("title,body").eq("id",id).single();if(error)return alert("공지 불러오기 실패: "+error.message);const title=prompt("공지 제목",data.title);if(title===null)return;const body=prompt("공지 내용",data.body);if(body===null)return;if(!title.trim()||!body.trim())return alert("제목과 내용은 필수입니다.");const{error:saveError}=await supabase.from("notice_posts").update({title:title.trim(),body:body.trim()}).eq("id",id);if(saveError)alert("수정 실패: "+saveError.message);else await loadNotices();});document.querySelectorAll("[data-notice-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("이 공지를 삭제할까요?"))return;const{error}=await supabase.from("notice_posts").delete().eq("id",b.dataset.noticeDelete);if(error)alert("삭제 실패: "+error.message);else await loadNotices();});}
$("addNotice").onclick=async()=>{const title=$("noticeTitle").value.trim(),body=$("noticeBody").value.trim();if(!title||!body)return alert("공지 제목과 내용을 입력해 주세요.");const{error}=await supabase.from("notice_posts").insert({title,body,author_name:author(),created_by:user?.id});if(error){alert("저장 실패: "+error.message);return;}$("noticeTitle").value="";$("noticeBody").value="";await loadNotices();};

// Study timer + private study sessions
let timerElapsed=0,timerStartedAt=null,timerInterval=null;
const fmtSeconds=n=>{n=Math.max(0,Math.floor(n));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");};
const elapsedNow=()=>timerElapsed+(timerStartedAt===null?0:Math.floor((Date.now()-timerStartedAt)/1000));
function paintTimer(){$("timerDisplay").textContent=fmtSeconds(elapsedNow());}
function stopTicker(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null;}}
$("timerStart").onclick=()=>{if(timerStartedAt!==null)return;if(!user)return alert("로그인 세션을 확인할 수 없습니다.");timerStartedAt=Date.now();timerInterval=setInterval(paintTimer,250);$("timerStatus").textContent="공부 중…";paintTimer();};
$("timerPause").onclick=()=>{if(timerStartedAt!==null){timerElapsed=elapsedNow();timerStartedAt=null;stopTicker();paintTimer();$("timerStatus").textContent="일시정지됨";}};
$("timerReset").onclick=()=>{timerElapsed=0;timerStartedAt=null;stopTicker();paintTimer();$("timerStatus").textContent="타이머가 초기화되었습니다.";};
$("timerSave").onclick=async()=>{const seconds=Math.floor(elapsedNow()),subject=$("studySubject").value.trim();if(!user)return alert("로그인 세션을 확인할 수 없습니다.");if(!subject)return alert("과목 또는 공부 내용을 입력해 주세요.");if(seconds<1)return alert("1초 이상 공부한 뒤 저장해 주세요.");const{error}=await supabase.from("study_sessions").insert({user_id:user.id,author_name:author(),subject,duration_seconds:seconds});if(error){alert("공부 기록 저장 실패: "+error.message);return;}timerElapsed=0;timerStartedAt=null;stopTicker();paintTimer();$("timerStatus").textContent="기록 저장 완료 · "+fmtSeconds(seconds);await loadStudySessions();await loadQuestBoard();};
async function loadStudySessions(){if(!user){$("studySessions").textContent="로그인 세션이 없습니다.";return;}const{data,error}=await supabase.from("study_sessions").select("id,subject,duration_seconds,studied_at,author_name").eq("user_id",user.id).order("studied_at",{ascending:false}).limit(50);if(error){$("studyStats").textContent="공부 기록 오류: "+error.message;return;}const total=data.reduce((sum,s)=>sum+s.duration_seconds,0);$("studyStats").textContent=`최근 ${data.length}개 기록 · 누적 ${fmtSeconds(total)}`;if(!data.length){$("studySessions").innerHTML='<p class="muted">아직 저장된 공부 기록이 없습니다.</p>';return;}$("studySessions").innerHTML=data.map(s=>`<div class="entry"><b>${escapeHTML(s.subject)}</b><small>${new Date(s.studied_at).toLocaleString("ko-KR")} · ${fmtSeconds(s.duration_seconds)}</small><button data-study-delete="${s.id}">삭제</button></div>`).join("");document.querySelectorAll("[data-study-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("이 공부 기록을 삭제할까요?"))return;const{error}=await supabase.from("study_sessions").delete().eq("id",b.dataset.studyDelete).eq("user_id",user.id);if(error)alert("삭제 실패: "+error.message);else{await loadStudySessions();await loadQuestBoard();}});}


// Daily goal + daily/weekly progress
const goalInput=$("dailyGoal");
async function loadGoalAndStats(){
 if(!user){$("goalStats").textContent="로그인 세션이 없습니다.";return;}
 const {data:goalRow,error:goalErr}=await supabase.from("study_goals").select("daily_goal_minutes").eq("user_id",user.id).maybeSingle();
 if(goalErr){$("goalStats").textContent="목표 불러오기 실패: "+goalErr.message;return;}
 const goal=goalRow?.daily_goal_minutes||60;goalInput.value=goal;
 const now=new Date(),todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString();
 const weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);
 const {data:sessions,error}=await supabase.from("study_sessions").select("duration_seconds,studied_at").eq("user_id",user.id).gte("studied_at",weekStart.toISOString());
 if(error){$("goalStats").textContent="통계 불러오기 실패: "+error.message;return;}
 const today=sessions.filter(s=>s.studied_at>=todayStart).reduce((a,s)=>a+s.duration_seconds,0);
 const week=sessions.reduce((a,s)=>a+s.duration_seconds,0);
 const pct=Math.min(100,Math.floor(today/(goal*60)*100));
 $("goalStats").innerHTML=`<b>오늘</b> ${fmtSeconds(today)} / ${goal}분 · ${pct}%<div style="height:10px;background:#ddd;border-radius:8px;overflow:hidden;margin:8px 0"><div style="height:100%;width:${pct}%;background:#4a8"></div></div><b>이번 주</b> ${fmtSeconds(week)}${today>=goal*60?' · 오늘 목표 달성!':''}`;
}
$("saveGoal").onclick=async()=>{if(!user)return alert("로그인 세션을 확인할 수 없습니다.");const n=Number(goalInput.value);if(!Number.isInteger(n)||n<1||n>1440)return alert("목표는 1~1440분 사이의 정수로 입력해 주세요.");const{error}=await supabase.from("study_goals").upsert({user_id:user.id,daily_goal_minutes:n,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error){alert("목표 저장 실패: "+error.message);return;}await loadGoalAndStats();};


// Quest and achievement board
async function loadQuestBoard(){
 if(!user){$("questBoard").textContent="로그인 세션이 없습니다.";return;}
 const {data,error}=await supabase.from("study_sessions").select("duration_seconds,studied_at").eq("user_id",user.id);
 if(error){$("questBoard").textContent="업적 불러오기 실패: "+error.message;return;}
 const now=new Date(),dayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
 const weekStart=new Date(dayStart);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));
 const today=data.filter(x=>new Date(x.studied_at)>=dayStart).reduce((a,x)=>a+x.duration_seconds,0);
 const week=data.filter(x=>new Date(x.studied_at)>=weekStart).reduce((a,x)=>a+x.duration_seconds,0);
 const total=data.reduce((a,x)=>a+x.duration_seconds,0),count=data.length;
 const quests=[
  ["첫 기록","공부 기록 1개 저장",count>=1],
  ["오늘의 시작","오늘 30분 공부",today>=1800],
  ["집중하는 날","오늘 60분 공부",today>=3600],
  ["주간 꾸준함","이번 주 5시간 공부",week>=18000],
  ["기록 수집가","공부 기록 10개",count>=10],
  ["누적 10시간","총 10시간 공부",total>=36000],
  ["누적 50시간","총 50시간 공부",total>=180000]
 ];
 $("questBoard").innerHTML=quests.map(([name,desc,done])=>`<div class="entry"><b>${done?"✓":"○"} ${name}</b><small>${desc} · ${done?"달성":"진행 중"}</small></div>`).join("");
}

init();
setTimeout(()=>{loadGoalAndStats();loadQuestBoard();},1200);
</script></body></html>
