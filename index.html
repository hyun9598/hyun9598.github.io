<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff; --ink:#1a1a1a; --line:#e6e6e6; --mute:#8a8a8a; --soft:#f5f6f8; --accent:#3b6cf6;
    --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;font-size:16px}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  /* 홈: 검색창만 */
  .home{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;padding:0 18px}
  .home-box{width:100%;max-width:560px;margin-top:20vh}
  .search{width:100%;font:inherit;font-size:18px;padding:16px 24px;border:1px solid var(--line);border-radius:999px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);background:#fff;color:var(--ink)}
  .search:focus{outline:none;border-color:var(--ink)}
  .results{margin-top:14px}
  .result{display:block;text-decoration:none;padding:12px 18px;border-radius:12px}
  .result:hover,.result:focus-visible,.result.first{background:var(--soft)}
  .result b{font-weight:500}
  .tag{font-size:13px;color:var(--mute);margin-left:8px}
  .snip{display:block;font-size:14px;color:var(--mute)}
  .none{padding:12px 18px;color:var(--mute)}

  /* 맨 위 목록창 (모든 페이지에서 계속 보여요) */
  .bar-top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}
  .bar-in{max-width:720px;margin:0 auto;padding:8px 14px;display:flex;gap:4px;align-items:center;overflow-x:auto}
  .home-link,.cat{flex:none;font:inherit;font-weight:500;color:var(--mute);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
  .home-link{color:var(--ink);font-weight:700;margin-right:6px}
  .cat.here{color:var(--ink);font-weight:700}
  .cat.open{background:var(--soft);color:var(--ink)}
  .panel{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.06)}
  .panel[hidden]{display:none}
  .panel-list{max-width:720px;margin:0 auto;padding:6px 14px 12px;display:flex;flex-direction:column}
  .p-item{text-decoration:none;padding:10px 12px;border-radius:8px}
  .p-item:hover,.p-item:focus-visible{background:var(--soft)}
  .p-item.on{font-weight:700;color:var(--accent)}
  main{max-width:720px;margin:0 auto;padding:22px 18px 60px}

  h2{font-size:26px;font-weight:700;margin-bottom:10px}
  h3{font-size:16px;font-weight:700;margin:26px 0 8px}
  .muted{color:var(--mute);font-size:14px}
  .empty{background:var(--soft);padding:18px;border-radius:12px;color:var(--mute)}

  .progress{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:99px}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:6px 0}

  .dolli-wrap{position:relative;padding-top:54px;margin:14px 0 8px}
  .dolli-icon{position:absolute;top:0;width:48px;transform:translateX(-50%)}
  .big{font-size:clamp(56px,16vw,96px);font-weight:700;line-height:1.1}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
  .stat{background:var(--soft);border-radius:12px;padding:10px 14px}
  .stat b{display:block;font-size:20px}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:4px 14px;font:inherit;cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal .dow{font-size:13px;color:var(--mute);padding:4px 0}
  .cal .day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:15px}
  .cal .day.leave{background:var(--accent);color:#fff;font-weight:700}
  .cal .day.today{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700}
  .leave-item{padding:10px 0;border-bottom:1px solid var(--line)}

  ul.tasks{list-style:none;padding:0;margin-top:8px}
  ul.tasks li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .mark{flex:none;width:20px;height:20px;border:2px solid var(--mute);border-radius:5px;position:relative;top:4px}
  li.done .mark{background:var(--ink);border-color:var(--ink)}
  li.done .mark::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  li.done .t{color:var(--mute);text-decoration:line-through}
  .dtag{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:6px;padding:1px 10px;margin-right:8px}

  /* 편집 기능 */
  .fab{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:20}
  .fab.on{background:var(--accent)}
  .banner{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
  .btn.danger{color:#c0392b}
  .btn.main{background:var(--ink);border-color:var(--ink);color:#fff}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
  .field label{font-size:13px;color:var(--mute)}
  .in{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
  .in:focus{outline:none;border-color:var(--ink)}
  .editbox{margin-top:26px;border:1px solid var(--line);border-radius:12px;padding:6px 16px 16px}
  .editbox .note{font-size:13px;color:var(--mute);margin-top:12px}
  .leave-edit{border-bottom:1px solid var(--line);padding:6px 0 12px}
  .leave-edit .btn{margin-top:4px}
  .taskrow{display:flex;gap:8px;align-items:center;padding:5px 0}
  .taskrow input[type=checkbox]{width:22px;height:22px;flex:none}
  .p-tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
  ul.tasks li.click{cursor:pointer}

  footer{max-width:720px;margin:0 auto;padding:0 18px 50px;font-size:14px;color:var(--mute)}
</style>
</head>
<body>

<div id="app"></div>

<script src="data.js"></script>
<script>
/* ================================================================
   이 파일(index.html)은 디자인과 기능이에요. 내용은 data.js에서 고치세요.
   ================================================================ */

if (typeof 내정보 === "undefined" || typeof 휴가 === "undefined" || typeof 목표 === "undefined" ||
    typeof 공부 === "undefined" || typeof 기타 === "undefined") {
  document.getElementById("app").textContent =
    "data.js 파일을 불러오지 못했어요. index.html과 같은 위치에 data.js가 있는지 확인해 주세요.";
  throw new Error("data.js 없음");
}

/* ---------- 도구 ---------- */
function h(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function 날짜(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function 날짜문자(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
const 오늘 = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
function 일수차(a, b){ return Math.round((a - b) / 86400000); }
function dday(s){
  const d = 일수차(날짜(s), 오늘);
  return d > 0 ? "D-" + d : d === 0 ? "D-DAY" : "D+" + (-d);
}
function 진행률(할일){
  if (!할일 || !할일.length) return null;
  return Math.round(할일.filter(t => t.완료).length / 할일.length * 100);
}
function 바(퍼센트){
  const w = h("div", "progress");
  w.setAttribute("role", "progressbar");
  w.setAttribute("aria-valuenow", String(Math.round(퍼센트)));
  const f = h("div", "fill");
  f.style.width = 퍼센트 + "%";
  w.appendChild(f);
  return w;
}

/* ---------- 저장 (이 기기의 브라우저에 저장돼요) ---------- */
const 저장키 = "my-record-site-v1";
const 편집키 = "my-record-site-edit";

function 복사(o){ return JSON.parse(JSON.stringify(o)); }

function 기본값(){
  return {
    내정보: 복사(내정보),
    휴가: 복사(휴가),
    분류: [
      { id: "goals", 이름: "목표", 항목: 복사(목표) },
      { id: "study", 이름: "공부", 항목: 복사(공부) },
      { id: "etc",   이름: "기타", 항목: 복사(기타) }
    ]
  };
}
function 정리(o){
  o.내정보 = Object.assign({ 이름: "", 입대일: "", 전역일: "", 연락처: "" }, o.내정보);
  o.휴가 = o.휴가.filter(v => v && v.시작).map(v => ({ 시작: v.시작, 끝: v.끝 || v.시작, 메모: v.메모 || "" }));
  o.분류 = o.분류.map(c => ({
    id: String(c.id || ("c" + Math.random().toString(36).slice(2, 8))),
    이름: String(c.이름 || "이름 없음"),
    항목: (Array.isArray(c.항목) ? c.항목 : []).map(it => ({
      제목: String(it.제목 || "제목 없음"),
      설명: it.설명 || "",
      날짜이름: it.날짜이름 || "",
      날짜: it.날짜 || "",
      할일: (Array.isArray(it.할일) ? it.할일 : []).map(t => ({ 글: String(t.글 || ""), 완료: !!t.완료 }))
    }))
  }));
  return o;
}
function 올바른가(o){ return o && o.내정보 && Array.isArray(o.휴가) && Array.isArray(o.분류); }
function 불러오기(){
  try {
    const raw = localStorage.getItem(저장키);
    if (raw){ const o = JSON.parse(raw); if (올바른가(o)) return o; }
  } catch (e) {}
  return 기본값();
}

let 상태 = 정리(불러오기());
let 편집중 = false;
try { 편집중 = localStorage.getItem(편집키) === "1"; } catch (e) {}
let 저장경고함 = false;

function 저장(){
  try { localStorage.setItem(저장키, JSON.stringify(상태)); }
  catch (e) {
    if (!저장경고함){
      저장경고함 = true;
      alert("이 브라우저에서는 저장이 안 돼요. 사생활 보호(시크릿) 모드라면 일반 창에서 열어 주세요.");
    }
  }
}

function 복무정보(){
  const 정보 = 상태.내정보;
  if (!정보.입대일 || !정보.전역일) return null;
  const s = 날짜(정보.입대일), e = 날짜(정보.전역일);
  const total = 일수차(e, s);
  if (total <= 0) return null;
  const done = 일수차(오늘, s);
  return {
    total,
    done: Math.min(total, Math.max(0, done)),
    left: Math.max(0, 일수차(e, 오늘)),
    pct: Math.min(100, Math.max(0, done / total * 100))
  };
}

/* ---------- 현재 화면 상태 / 이동 ---------- */
let 현재키 = null, 현재번호 = -1, 현재뷰 = null, 현재그리기 = null;

function 화면다시(){
  if (현재뷰 && 현재그리기){ 현재뷰.innerHTML = ""; 현재그리기(현재뷰); }
}
function 가기(링크){
  const 목표해시 = 링크 === "#" ? "" : 링크;
  if (location.hash === 목표해시 || (!location.hash && 목표해시 === "")) 이동();
  else location.hash = 링크;
}

/* ---------- 편집용 입력칸 ---------- */
function 글칸(라벨, 값, 입력, 변경, 여러줄, 힌트){
  const f = h("div", "field");
  const l = h("label", "", 라벨);
  const inp = h(여러줄 ? "textarea" : "input", "in");
  if (여러줄) inp.rows = 2; else inp.type = "text";
  inp.value = 값 || "";
  if (힌트) inp.placeholder = 힌트;
  inp.setAttribute("aria-label", 라벨);
  inp.addEventListener("input", () => 입력(inp.value));
  if (변경) inp.addEventListener("change", () => 변경(inp));
  f.append(l, inp);
  return f;
}
function 날짜칸(라벨, 값, 변경){
  const f = h("div", "field");
  const l = h("label", "", 라벨);
  const inp = h("input", "in");
  inp.type = "date";
  inp.value = 값 || "";
  inp.setAttribute("aria-label", 라벨);
  inp.addEventListener("change", () => 변경(inp.value));
  f.append(l, inp);
  return f;
}
function 버튼(글, 종류, 누르면){
  const b = h("button", "btn" + (종류 ? " " + 종류 : ""), 글);
  b.type = "button";
  b.addEventListener("click", 누르면);
  return b;
}

/* ---------- 화면: 군돌이 ---------- */
function 날짜설정상자(){
  const box = h("div", "editbox");
  box.appendChild(h("h3", "", "날짜 설정"));
  box.appendChild(날짜칸("입대일", 상태.내정보.입대일, v => { 상태.내정보.입대일 = v; 저장(); 화면다시(); }));
  box.appendChild(날짜칸("전역일", 상태.내정보.전역일, v => { if (v){ 상태.내정보.전역일 = v; 저장(); 화면다시(); } }));
  return box;
}

function 군돌이(box){
  box.appendChild(h("h2", "", "군돌이"));
  const info = 복무정보();
  if (!info){
    const 글 = 상태.내정보.입대일
      ? "입대일과 전역일을 확인해 주세요. 입대일이 전역일보다 앞이어야 해요."
      : (편집중 ? "입대일을 아래에 입력하면 군생활 진행률이 보여요." : "입대일이 아직 없어요. 오른쪽 아래 ✎ 버튼을 눌러 입력할 수 있어요.");
    box.appendChild(h("div", "empty", 글));
    if (편집중) box.appendChild(날짜설정상자());
    return;
  }
  box.appendChild(h("div", "big", info.pct.toFixed(1) + "%"));
  const wrap = h("div", "dolli-wrap");
  const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("viewBox", "0 0 48 48");
  icon.setAttribute("class", "dolli-icon");
  icon.setAttribute("aria-hidden", "true");
  icon.innerHTML =
    '<circle cx="24" cy="28" r="14" fill="#f5f6f8" stroke="#1a1a1a" stroke-width="2"/>' +
    '<path d="M8 26 C8 10 40 10 40 26 Z" fill="#3b6cf6" stroke="#1a1a1a" stroke-width="2"/>' +
    '<circle cx="18" cy="31" r="2" fill="#1a1a1a"/><circle cx="30" cy="31" r="2" fill="#1a1a1a"/>' +
    '<path d="M19 37 Q24 41 29 37" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>';
  icon.style.left = Math.min(96, Math.max(4, info.pct)) + "%";
  wrap.append(icon, 바(info.pct));
  box.appendChild(wrap);

  const stats = h("div", "stats");
  [["복무", info.done + "일째"], ["남은 날", info.left + "일"], ["전체", info.total + "일"]].forEach(([k, v]) => {
    const s = h("div", "stat");
    s.append(h("span", "muted", k), h("b", "", v));
    stats.appendChild(s);
  });
  box.appendChild(stats);
  if (편집중) box.appendChild(날짜설정상자());
}

/* ---------- 화면: 휴가 달력 ---------- */
let 보는달 = new Date(오늘.getFullYear(), 오늘.getMonth(), 1);

function 휴가달력(box){
  box.innerHTML = "";
  box.appendChild(h("h2", "", "휴가 달력"));
  const 휴가들 = 상태.휴가;

  const 다음 = 휴가들
    .filter(v => 일수차(날짜(v.끝), 오늘) >= 0)
    .sort((a, b) => 날짜(a.시작) - 날짜(b.시작))[0];
  if (다음){
    const until = 일수차(날짜(다음.시작), 오늘);
    box.appendChild(h("p", "", until > 0 ? `다음 휴가까지 ${until}일 남았어요.` : "지금 휴가 중이에요!"));
  }

  const head = h("div", "cal-head");
  const prev = h("button", "", "◀");
  const next = h("button", "", "▶");
  prev.type = next.type = "button";
  prev.setAttribute("aria-label", "이전 달");
  next.setAttribute("aria-label", "다음 달");
  prev.addEventListener("click", () => { 보는달 = new Date(보는달.getFullYear(), 보는달.getMonth() - 1, 1); 휴가달력(box); });
  next.addEventListener("click", () => { 보는달 = new Date(보는달.getFullYear(), 보는달.getMonth() + 1, 1); 휴가달력(box); });
  head.append(prev, h("b", "", `${보는달.getFullYear()}년 ${보는달.getMonth() + 1}월`), next);
  box.appendChild(head);

  const cal = h("div", "cal");
  ["일","월","화","수","목","금","토"].forEach(x => cal.appendChild(h("div", "dow", x)));
  const first = new Date(보는달.getFullYear(), 보는달.getMonth(), 1).getDay();
  const last = new Date(보는달.getFullYear(), 보는달.getMonth() + 1, 0).getDate();
  for (let i = 0; i < first; i++) cal.appendChild(h("div"));
  for (let day = 1; day <= last; day++){
    const date = new Date(보는달.getFullYear(), 보는달.getMonth(), day);
    const cell = h("div", "day", String(day));
    if (휴가들.some(v => date >= 날짜(v.시작) && date <= 날짜(v.끝))) cell.classList.add("leave");
    if (일수차(date, 오늘) === 0) cell.classList.add("today");
    cal.appendChild(cell);
  }
  box.appendChild(cal);

  const 순서 = 휴가들.map((v, i) => i).sort((a, b) => 날짜(휴가들[a].시작) - 날짜(휴가들[b].시작));

  if (!편집중){
    box.appendChild(h("h3", "", "휴가 목록"));
    if (!휴가들.length){
      box.appendChild(h("div", "empty", "아직 등록된 휴가가 없어요. 오른쪽 아래 ✎ 버튼을 눌러 추가할 수 있어요."));
    } else {
      순서.forEach(i => {
        const v = 휴가들[i];
        const r = h("div", "leave-item");

/* ---------- 검색 ---------- */
function 정규화(s){ return String(s).toLowerCase().replace(/\s+/g, ""); }

function 검색(질문){
  const q = 정규화(질문);
  if (!q) return [];
  const 색인 = [];
  메뉴목록().forEach(m => m.하위.forEach((s, i) => {
    색인.push({ 제목: s.이름, 구분: m.이름, 링크: "#" + m.키 + "/" + i, 글: s.글 });
  }));
  return 색인.map(e => {
    let score = 0, snip = "";
    const t = 정규화(e.제목);
    if (t === q) score = 100;
    else if (t.startsWith(q)) score = 90;
    else if (t.includes(q)) score = 80;
    else if (정규화(e.구분).includes(q)) score = 50;
    if (score < 80){
      const hit = e.글.find(x => x && 정규화(x).includes(q));
      if (hit){ score = Math.max(score, 60); snip = hit; }
    }
    return { e, score, snip };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
}

/* ---------- 페이지 이동 ---------- */
function 이동(스크롤유지){
  const parts = location.hash.slice(1).split("/");
  const 목록 = 메뉴목록();
  const menu = 목록.find(m => m.키 === parts[0]);
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (!menu){

    app.appendChild(헤더(null, -1));
    홈(app);
    app.appendChild(플로팅());
    return;
  }
  const idx = Math.max(0, Math.min(Number(parts[1]) || 0, menu.하위.length - 1));
  현재키 = menu.키; 현재번호 = idx;
  app.appendChild(헤더(menu.키, idx));

  const main = h("main");
  if (편집중) main.appendChild(배너());
  if (menu.하위.length){
    const view = h("div");
    main.appendChild(view);
    현재뷰 = view;
    현재그리기 = menu.하위[idx].그리기;
